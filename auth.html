<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <meta name="description" content="Sign in or create an account at ShopEase">
    <meta name="theme-color" content="#2563eb">    <title>Login & Signup | ShopEase</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">ShopEase</a>
                <nav class="nav" aria-label="Primary navigation">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="index.html">Products</a></li>
                        <li><a href="#">About</a></li>
                        <li><a href="#">Contact</a></li>
                    </ul>
                </nav>
                <button class="cart-button" aria-label="View cart">
                    <span>🛒</span>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="auth-container">
            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to your ShopEase account</p>
                </div>

                <form id="loginFormElement" class="form" novalidate>
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            name="email" 
                            placeholder="you@example.com"
                            required
                        >
                        <span class="error-message" id="loginEmailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="loginPassword" 
                                name="password" 
                                placeholder="Enter your password"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                aria-label="Toggle password visibility"
                                data-target="loginPassword"
                            >
                                👁️
                            </button>
                        </div>
                        <span class="error-message" id="loginPasswordError"></span>
                    </div>

                    <div class="form-options">
                        <a href="#" class="forgot-password">Forgot Password?</a>
                    </div>

                    <button type="submit" class="primary-button">Sign In</button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <button type="button" class="link-button" id="switchToSignup">Sign Up</button></p>
                </div>
            </div>

            <!-- Signup Form -->
            <div id="signupForm" class="auth-form">
                <div class="auth-header">
                    <h1>Create Account</h1>
                    <p>Join ShopEase to enjoy personalized shopping</p>
                </div>

                <form id="signupFormElement" class="form" novalidate>
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input 
                            type="text" 
                            id="signupName" 
                            name="name" 
                            placeholder="John Doe"
                            required
                        >
                        <span class="error-message" id="signupNameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            name="email" 
                            placeholder="you@example.com"
                            required
                        >
                        <span class="error-message" id="signupEmailError"></span>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="signupPassword" 
                                name="password" 
                                placeholder="At least 8 characters"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                aria-label="Toggle password visibility"
                                data-target="signupPassword"
                            >
                                👁️
                            </button>
                        </div>
                        <span class="error-message" id="signupPasswordError"></span>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-meter" id="strengthMeter"></div>
                            <span class="strength-text" id="strengthText"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword">Confirm Password</label>
                        <div class="password-wrapper">
                            <input 
                                type="password" 
                                id="signupConfirmPassword" 
                                name="confirmPassword" 
                                placeholder="Re-enter your password"
                                required
                            >
                            <button 
                                type="button" 
                                class="password-toggle" 
                                aria-label="Toggle password visibility"
                                data-target="signupConfirmPassword"
                            >
                                👁️
                            </button>
                        </div>
                        <span class="error-message" id="signupConfirmPasswordError"></span>
                    </div>

                    <button type="submit" class="primary-button">Create Account</button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <button type="button" class="link-button" id="switchToLogin">Sign In</button></p>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="scripts/firebase-config.js"></script>
    
    <!-- Auth Script -->
    <script src="scripts/auth.min.js"></script>
</body>
</html>
