<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ShopEase</title>
    <link rel="stylesheet" href="styles/main.min.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">ShopEase</a>

            <nav class="nav-menu" aria-label="Primary navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="auth.html">Sign In</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <button class="cart-button" aria-label="View cart">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-badge">0</span>
                </button>
            </div>

            <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="mobile-menu" aria-hidden="true">
            <ul class="mobile-nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="auth.html">Sign In</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="cart-page">
            <div class="section-header">
                <p class="eyebrow">Your cart</p>
                <h2>Review your order</h2>
            </div>

            <div class="cart-layout">
                <div class="cart-items" id="cartList">
                    <div class="cart-empty">
                        <p>Your cart is currently empty.</p>
                        <a class="primary-button" href="index.html">Continue shopping</a>
                    </div>
                </div>

                <aside class="cart-summary">
                    <div class="summary-card">
                        <h3>Order summary</h3>
                        <div class="summary-row">
                            <span>Subtotal</span>
                            <strong id="cartTotal">$0.00</strong>
                        </div>
                        <button class="primary-button checkout-button" id="checkoutButton" type="button" disabled>Proceed to Checkout</button>
                        <a class="secondary-button" href="index.html">Continue Shopping</a>
                    </div>
                </aside>
            </div>
        </section>
    </main>

    <script src="scripts/lazyload.js" defer></script>
    <script src="scripts/cart.min.js" defer></script>
</body>
</html>
