<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <meta name="description" content="Product details - ShopEase">
    <meta name="theme-color" content="#2563eb">    <title>Product Details | ShopEase</title>
    <link rel="stylesheet" href="styles/main.min.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">ShopEase</a>

            <nav class="nav-menu" aria-label="Primary navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html">Products</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Contact</a></li>
                    <li><a href="auth.html">Sign In</a></li>
                </ul>
            </nav>

            <div class="header-actions">
                <button class="cart-button" aria-label="View cart">
                    <span class="cart-icon">🛒</span>
                    <span class="cart-badge">0</span>
                </button>
            </div>

            <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div class="mobile-menu" aria-hidden="true">
            <ul class="mobile-nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="auth.html">Sign In</a></li>
            </ul>
        </div>
    </header>

    <main>
        <section class="product-detail-page">
            <div class="section-header">
                <p class="eyebrow">Product details</p>
                <h2>Explore this item</h2>
            </div>

            <div class="product-detail-grid" id="detailPlaceholder">
                <div class="product-card loading-card">
                    <div class="spinner"></div>
                    <p>Loading product details...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="scripts/lazyload.js" defer></script>
    <script src="scripts/product.min.js" defer></script>
</body>
</html>
